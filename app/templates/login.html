<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" action="/login" method="POST">
            <div class="input-container">
                <label for="nombre_usuario" class="icon">👤</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Nombre de usuario" required>
            </div>
            <div class="input-container">
                <label for="contrasena" class="icon">🔒</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>               
        <div class="login-link">
            ¿No tienes una cuenta? <a href="/registro">Regístrate</a>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>

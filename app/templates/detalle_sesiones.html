<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/detalle_sesiones.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Sesión de Monitoreo</title>
</head>
<body>
    <div class="top-bar">
   
        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
        </div>
    </div>

    

    <nav class="navigation">
      <div class="menu-icon">
        <a href="/principal" class="home-button">
            <i class="bi bi-house-fill"></i>
        </a>
    </div>
        <a href="/historial_clinico" class="d-flex align-items-center">
            <i class="bi bi-clock-history me-2"></i> Historia Clínica
        </a>
        <a href="/sesiones" class="d-flex align-items-center selected">
            <i class="bi bi-menu-down me-2"></i> Sesiones
        </a>          
        <a href="/dispositivos" class="d-flex align-items-center">
            <i class="bi bi-cpu me-2"></i> Dispositivos
        </a>          
        <a href="/niveles_ejercicios" class="d-flex align-items-center">
            <i class="bi bi-person-walking me-2"></i> Ejercicios
        </a>          
        <a href="#" class="d-flex align-items-center">
            <i class="bi bi-chat-dots me-2"></i> Chat
        </a>
    </nav>
    
    <!-- Encabezado de la sesión -->
    <header class="header">
        <div class="back-arrow" id="salir-detalle"><i class="bi bi-box-arrow-left"></i></div>
        <div>
            <h1 id="session-title">Sesión</h1>
            <p id="session-date">📅 Cargando fecha...</p>
            <p id="session-time">⏰ Cargando hora...</p>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="container">
        <!-- Panel izquierdo -->
        <div class="left-panel"></div>

        <!-- Columna central con gráficos (Aquí ahora está la "Nota Evolutiva") -->
        <div class="charts-column">
            <!-- 📌 Nota Evolutiva reubicada aquí -->
            <div class="evolution-box">
                <div class="black-header">Nota Evolutiva</div>
                <div class="evolution-lines">
                    <textarea id="nota-evolutiva" class="line" placeholder="Escribe aquí..." rows="10" cols="50" style="resize: none;"></textarea>
                </div>
            </div>
            <!-- Descripción editable centrada -->
            <div class="description-box">
              <div class="black-header">Descripción</div>
              <div class="description-lines">
                  <textarea id="session-description" class="line" placeholder="Escribe la descripción aquí..." rows="3"></textarea>
              </div>
            </div>

            <!-- Descripción editable centrada -->
            <div class="description-box">
              <div class="black-header">Descripción</div>
              <div class="black-header">Descripción</div>
              <div class="black-header">Descripción</div>
            
            </div>
        </div>

        <!-- 📌 Área donde antes estaba "Nota Evolutiva", ahora es para gráficos -->
        <div class="evolution-box">
            <div class="black-header">Gráficos</div>
            <div class="charts">
                <div class="chart-placeholder">📊 Aquí se mostrarán los gráficos</div>
            </div>
        </div>           
    </div>
    <div id="message-container"></div>
</body>
<script src="/static/js/detalle_sesiones.js"></script>
</html>

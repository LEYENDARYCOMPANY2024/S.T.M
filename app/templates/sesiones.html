<div class="container">
  <h2></h2>

  <!-- 📌 Contenedor para las sesiones -->
  <div id="sessions-container"></div>

  <!-- 📌 Controles de paginación -->
  <div id="pagination"></div>

  <!-- 📌 Formulario para agregar sesión -->
  <div class="add-session">
    <h2>Agregar sesión</h2>
    <input type="text" id="session-desc" class="input-field" placeholder="Descripción">

    <!-- 📌 Campo de fecha SIN el calendario nativo -->
    <div class="date-picker">
        <input type="text" id="session-date" class="input-field" placeholder="Selecciona una fecha" readonly>
    </div>

    <!-- 📌 Calendario que aparece al hacer clic en el icono -->
    <div class="calendar-container hidden" id="calendar-container">
        <div class="calendar">
            <div class="controls">
                <button onclick="changeMonth(-1)">&#9665;</button>
                <div class="month" id="month-year"></div>
                <button onclick="changeMonth(1)">&#9655;</button>
            </div>
            <div class="days" id="calendar-grid">
                <div class="header">Lun</div><div class="header">Mar</div>
                <div class="header">Mié</div><div class="header">Jue</div>
                <div class="header">Vie</div><div class="header">Sáb</div>
                <div class="header">Dom</div>
            </div>
            <div class="days" id="calendar-days"></div>
        </div>
    </div>


    <input type="time" id="session-time" class="input-field">
    <button class="create-button" onclick="crearSesion()">Crear sesión</button>
</div>
    </main>
    <script src="/static/js/sesiones.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
        <link rel="stylesheet" href="/app/static/css/registro.css">
</head>
<body>
    <div class="register-container">
        <h2>Registro</h2>
        <div class="input-container">
            <span class="icon">👤</span>
            <input type="text" placeholder="Nombre de usuario" required>
        </div>
        <div class="input-container">
            <span class="icon">📛</span>
            <input type="text" placeholder="Nombres" required>
        </div>
        <div class="input-container">
            <span class="icon">🆎</span>
            <input type="text" placeholder="Primer apellido" required>
        </div>
        <div class="input-container">
            <span class="icon">🆎</span>
            <input type="text" placeholder="Segundo apellido" required>
        </div>
        <div class="input-container">
            <span class="icon">📧</span>
            <input type="email" placeholder="Correo electrónico" required>
        </div>
        <div class="input-container">
            <span class="icon">🔒</span>
            <input type="password" placeholder="Contraseña" required>
        </div>
        <button>Registrarse</button>
        <div class="login-link">
            ¿Ya tienes una cuenta? <button>Iniciar sesión</button>
        </div>
    </div>
</body>
</html>

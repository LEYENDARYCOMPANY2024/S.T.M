<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pacientes</title>
  
    <link rel="stylesheet" href="/static/css/principal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="user-icon" id="profileIcon"><i class="fas fa-user-circle"></i></div>
        </div>
    </header>

    <main>
        <!-- 🔹 Barra de búsqueda de pacientes -->
        <div class="search-bar">
            <input type="text" placeholder="Buscar paciente...">
            <button class="close-btn">🔍</button>
        </div>

        <!-- 🔹 Botones de pestañas -->
        <div class="tab-container">
            <button class="tab-btn active" id="btn-activos">Pacientes Activos</button>
            <button class="tab-btn" id="btn-inactivos">Pacientes Inactivos</button>
        </div>

        <!-- 🔹 Sección de Pacientes Activos -->
        <section id="section-activos" class="tab-content">
            <div id="patients-list-activos" class="patients-list"></div>
            <div id="pagination-activos" class="pagination-container"></div>
        </section>

        <!-- 🔹 Sección de Pacientes Inactivos (Oculta por defecto) -->
        <section id="section-inactivos" class="tab-content hidden">
            <div id="patients-list-inactivos" class="patients-list"></div>
            <div id="pagination-inactivos" class="pagination-container"></div>
        </section>

        <!-- 🔹 Botón para abrir el modal -->
        <button class="add-btn" id="openModalBtn"><i class="fa-solid fa-plus"></i></button>

        <!-- 🔹 Modal para agregar pacientes -->
        <div class="modal" id="addPatientModal">
            <div class="modal-content">
                <button class="close-modal-btn">&times;</button>
                <h2>Agregar paciente</h2>
                <form id="addPatientForm">
                    <input type="text" name="nombre" placeholder="Nombre" required>
                    <input type="text" name="primer_apellido" placeholder="Primer Apellido" required>
                    <input type="text" name="segundo_apellido" placeholder="Segundo Apellido">
                    <input type="number" name="edad" placeholder="Edad" required>

                    <select name="genero" required>
                        <option value="" disabled hidden>Selecciona un género</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>

                    <button type="submit" class="submit-btn">Agregar</button>
                </form>                          
            </div>
        </div>

        <!-- 🔹 Alerta de éxito al agregar paciente -->
        <div class="alert" id="successAlert">
            <span class="alert-icon">✅</span>
            <span>¡Paciente agregado exitosamente!</span>
        </div>
    </main>

    <script src="/static/js/principal.js"></script>
</body>
</html>

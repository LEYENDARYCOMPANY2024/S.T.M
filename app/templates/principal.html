<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pacientes</title>
  
    <link rel="stylesheet" href="/static/css/principal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="user-icon" id="profileIcon"><i class="fas fa-user-circle"></i></div>

        </div>
    </header>
    <main>
        <div class="search-bar">
            <input type="text" placeholder="Buscar paciente...">
            <button class="close-btn">🔍</button>
        </div>
        <div class="patients-list">
            <!-- La lista de pacientes estará vacía inicialmente -->
        </div>
        <button class="add-btn" id="openModalBtn"><i class="fa-solid fa-plus"></i></button>

        <div class="modal" id="addPatientModal">
            <div class="modal-content">
                <button class="close-modal-btn">&times;</button>
                <h2>Agregar paciente</h2>
                <form id="addPatientForm">
                    <input type="text" placeholder="Nombre" required>
                    <input type="text" placeholder="Primer Apellido" required>
                    <input type="text" placeholder="Segundo Apellido">
                    <input type="number" placeholder="Edad" required>
                    <select required>
                        <option value="" disabled selected>Sexo</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                    <button type="submit" class="submit-btn">Agregar</button>
                </form>
            </div>
        </div>
        
        <!-- Alerta de éxito -->
        <div class="alert" id="successAlert">
            <span class="alert-icon">✅</span>
            <span>¡Paciente agregado exitosamente!</span>
        </div>
        <script src="/static/js/principal.js"></script>
    </main>
</body>
</html>
